<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRATION FORM</title>
</head>
<body>
    <header><b>STUDENT REGISTRATION FORM</b></header><br><hr>
    <form>
    <label for="name">FullName:  </label>
    <input type="text" id="name" name="name"><br><br><hr>

    <label for="email">Email:  </label>
    <input type ="text" id="email" name ="email"> <br> <BR><hr>

    <label for="AGE">Age: </label>
        <input type="number" id="age" name="age">
        <br><br><hr>

    <label for="phone">Phone#   </label>
    <input type ="tel" id="phone" name ="phone"><br><br><hr>
    

    <label for="address">Address: </label>
    <input type ="text" id="address" name ="address"><br>  <br> <hr>
    
    <label for="gender">Gender:  </label><br><br>
    <input type="radio" id="male" name="gender" value="male">
    
    <label for="male">Male </label>
    <input type="radio" id="female" name="gender" value="female">
    
    <label for="female">Female </label> 
    <input type="radio" id="other" name="gender" value="other"><br><br>
        <label for="other">Other </label><br><br><hr>

 <label for="course">Select Course:</label><br></br>
    <select id="course" name="course">
        <option value="cs">Computer Science</option>
        <option value="it">Information Technology</option>
        <option value="ai">AI</option>
    </select><br><br><hr>


<label>Skills:</label>
<input type="Checkbox" id="html" name="skills" value="HTML">
<label for="html">HTML</label>

<input type="checkbox" id="css" name="skills" value="CSS">
<label for="css">CSS</label>

<input type="checkbox" id="js" name="skills" value="JavaScript">
<label for="js">JavaScript</label> <br> <Br><hr>

<label for="message">Message:</label>
<textarea id="message" name="message" placeholder="Enter your message here..."></textarea>
<hr>
        <button type="reset">Reset</button>
        <button type="submit">Submit</button>


    </form>
</body>
</html>
